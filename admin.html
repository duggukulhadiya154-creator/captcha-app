<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - Smart Rewards</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #080d1b;
            --panel: #101a2d;
            --line: #293b5b;
            --cyan: #53e8ff;
            --green: #49efae;
            --red: #ff7897;
            --text: #f4f7ff;
            --muted: #91a2c2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: radial-gradient(ellipse at 50% 0%, #15385c, transparent 45%), var(--bg); color: var(--text); padding: 18px; min-height: 100vh; }
        .container { max-width: 950px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 18px 22px; border-radius: 18px; margin-bottom: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .header h1 { font-size: 1.25rem; color: var(--cyan); letter-spacing: 0.5px; }
        .admin-tag { font-size: 0.85rem; color: var(--muted); margin-right: 12px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 25px; }
        .stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-align: center; }
        .stat-card h3 { font-size: 0.8rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .stat-val { font-size: 2rem; font-weight: 800; margin-top: 6px; color: var(--cyan); }

        .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow-x: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; min-width: 650px; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--line); }
        th { background: #0c1424; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.8px; }
        
        .badge { padding: 5px 9px; border-radius: 20px; font-weight: 700; font-size: 0.72rem; }
        .badge-pending { background: #854d0e33; color: #fde047; border: 1px solid #ca8a04; }
        .badge-approved { background: #16653433; color: var(--green); border: 1px solid #16a34a; }
        .badge-rejected { background: #991b1b33; color: var(--red); border: 1px solid #dc2626; }

        .btn { border: none; padding: 7px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
        .btn-pay { background: #16a34a; color: white; margin-right: 6px; }
        .btn-pay:hover { filter: brightness(1.2); }
        .btn-reject { background: #dc2626; color: white; }
        .btn-reject:hover { filter: brightness(1.2); }
        .btn-logout { background: #1e293b; color: var(--red); border: 1px solid #ff789744; padding: 8px 14px; }

        .auth-box { max-width: 420px; margin: 100px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 35px 25px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .btn-google { background: white; color: #080d1b; border: none; padding: 13px 22px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 22px; width: 100%; font-size: 0.95rem; }
        .notice-err { color: var(--red); font-size: 0.82rem; margin-top: 14px; display: none; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Box -->
    <div id="adminAuthScreen" class="auth-box">
        <h2 style="font-size: 1.5rem; color: var(--cyan); margin-bottom: 8px;">🔒 Admin Panel</h2>
        <p style="font-size: 0.85rem; color: var(--muted);">Sign in with your authorized Gmail to access redemption controls.</p>
        <button class="btn-google" onclick="loginAdmin()">Sign In with Google</button>
        <div id="authErr" class="notice-err"></div>
    </div>

    <!-- Main Dashboard -->
    <div id="adminDashboard" style="display:none;">
        <div class="header">
            <div>
                <h1>🛡️ Admin Dashboard</h1>
                <span id="adminEmailDisplay" class="admin-tag"></span>
            </div>
            <button class="btn btn-logout" onclick="auth.signOut()">Logout ↗</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Registered</h3>
                <div id="totalUsersCount" class="stat-val">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Requests</h3>
                <div id="pendingCount" class="stat-val" style="color: #fde047;">0</div>
            </div>
            <div class="stat-card">
                <h3>Completed Payouts</h3>
                <div id="paidCount" class="stat-val" style="color: var(--green);">0</div>
            </div>
        </div>

        <h2 style="font-size: 1.1rem; margin-bottom: 14px; letter-spacing: 0.5px;">User Redemption Requests</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>User Email</th>
                        <th>UPI / Paytm Details</th>
                        <th>Coins</th>
                        <th>Payable (INR)</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="withdrawalsTableBody">
                    <tr><td colspan="7" style="text-align:center; color: var(--muted); padding: 25px;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyBDzcbfjXC9WOl3Kwz377t9R4EeYomd74k",
      authDomain: "captchaearn-a679f.firebaseapp.com",
      projectId: "captchaearn-a679f",
      storageBucket: "captchaearn-a679f.firebasestorage.app",
      messagingSenderId: "1090622823716",
      appId: "1:1090622823716:web:02cda6f35f1055361b67b1",
      measurementId: "G-PR6D0LTXV4"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const ADMIN_EMAIL = "rashmikulhadiya6@gmail.com";

    auth.onAuthStateChanged(user => {
        if (user) {
            if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById("adminAuthScreen").style.display = "none";
                document.getElementById("adminDashboard").style.display = "block";
                document.getElementById("adminEmailDisplay").innerText = "Logged in: " + user.email;
                loadRealtimeData();
            } else {
                auth.signOut();
                showError("Access Denied: Only " + ADMIN_EMAIL + " is authorized.");
            }
        } else {
            document.getElementById("adminAuthScreen").style.display = "block";
            document.getElementById("adminDashboard").style.display = "none";
        }
    });

    function loginAdmin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => showError(err.message));
    }

    function showError(msg) {
        const el = document.getElementById("authErr");
        el.innerText = msg;
        el.style.display = "block";
    }

    function loadRealtimeData() {
        // Users Count
        db.collection("users").onSnapshot(snap => {
            document.getElementById("totalUsersCount").innerText = snap.size;
        });

        // Withdrawals Listen
        db.collection("withdrawals").orderBy("createdAt", "desc").onSnapshot(snap => {
            let pending = 0;
            let paid = 0;
            const tbody = document.getElementById("withdrawalsTableBody");
            tbody.innerHTML = "";

            if (snap.empty) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--muted); padding: 25px;">No withdrawal requests found.</td></tr>';
                return;
            }

            snap.forEach(doc => {
                const data = doc.data();
                if (data.status === "Pending") pending++;
                if (data.status === "Approved") paid++;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><b>${data.name || "User"}</b></td>
                    <td>${data.email || "N/A"}</td>
                    <td style="color: var(--cyan); font-weight: 700;">${data.upi || "N/A"}</td>
                    <td>${data.coins} 🪙</td>
                    <td><b>₹${data.amountINR || (data.coins / 20).toFixed(2)}</b></td>
                    <td><span class="badge ${data.status === 'Pending' ? 'badge-pending' : (data.status === 'Approved' ? 'badge-approved' : 'badge-rejected')}">${data.status}</span></td>
                    <td>
                        ${data.status === 'Pending' ? `
                            <button class="btn btn-pay" onclick="approveRequest('${doc.id}')">Pay / Approve</button>
                            <button class="btn btn-reject" onclick="rejectRequest('${doc.id}', '${data.uid}',${data.coins})">Reject</button>
                        ` : `<span style="color: var(--muted);">Completed</span>`}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("pendingCount").innerText = pending;
            document.getElementById("paidCount").innerText = paid;
        });
    }

    function approveRequest(docId) {
        if (confirm("Kya aapne is user ko UPI/Paytm par paise bhej diye hain? Status Approved karein?")) {
            db.collection("withdrawals").doc(docId).update({
                status: "Approved",
                paidAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    }

    function rejectRequest(docId, uid, coins) {
        if (confirm("Reject karne par user ke coins wapas uske wallet mein refund ho jayenge. Confirm karein?")) {
            db.collection("withdrawals").doc(docId).update({
                status: "Rejected",
                rejectedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                db.collection("users").doc(uid).update({
                    coins: firebase.firestore.FieldValue.increment(coins)
                });
            });
        }
    }
</script>
</body>
</html>
